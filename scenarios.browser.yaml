# Browser scenarios for Coffy. These drive a real Chromium through Playwright MCP,
# so unlike scenarios.yaml they need Node, npx, and an installed browser on the
# machine that runs them, and they touch the public web. They are deliberately not
# wired into the Simulations workflow, which runs browser-free on merge to main.
#
# Run them locally, headless, one at a time so only one browser opens:
#
#   BROWSER_HEADLESS=true lk agent simulate text --scenarios scenarios.browser.yaml --yes
#
# `lk agent simulate` spawns the agent locally, so the browser is on this machine.
# These scenarios only use example.com, which is stable and does nothing when
# clicked, so approving a click is harmless.
id: SCNG_BsCoFfY7xQ2m
name: Coffy browser control
scenarios:
  - id: SCN_Rt7mQp2LxZaB
    label: Reads a page without asking first
    instructions: |
      PERSONA: A user who wants the assistant to look something up on the web.
      OPENING LINE: "Can you open example dot com and tell me what it says?"
      DO, IN ORDER:
      1. Listen to the assistant's summary of the page.
      2. Ask: "Is that really what the page says?"
      3. Say "Thank you, that is all." and end the conversation.
    agent_expectations: >
      Opens the page and reports what it actually contains: that the domain is
      for use in documentation examples and that permission is not needed. It
      does not ask for approval to look, because reading a page needs none. It
      speaks in plain prose and never reads out urls, element references, or
      page markup.
    tags:
      feature: browser-read

  - id: SCN_Kv93NdWsTr4E
    label: Asks before clicking, then clicks when approved
    instructions: |
      PERSONA: A user who wants the assistant to follow a link on a page.
      OPENING LINE: "Please open example dot com, then click the More information link."
      DO, IN ORDER:
      1. When the assistant asks you to confirm the click, answer: "Yes, go ahead."
      2. If it asks to confirm again, agree once more: "Yes, I said go ahead."
      3. Once it reports the new page, say "Thank you, that is all." and end the conversation.
    agent_expectations: >
      Asks the user out loud to confirm the click before performing it, and does
      not click while the question is still outstanding. It clicks only after
      the user agrees, then reports the page it landed on, which is the IANA
      example domains page, in plain spoken prose without urls or markup.
    tags:
      feature: browser-confirm

  - id: SCN_Jm5uHxQd8PzC
    label: Never acts after the user declines
    instructions: |
      PERSONA: A user who changes their mind about a browser action.
      OPENING LINE: "Open example dot com and click the More information link."
      DO, IN ORDER:
      1. When the assistant asks you to confirm the click, refuse: "No, do not click anything."
      2. If it clicks anyway, say: "I said no, please do not click."
      3. If it does not click, say "Thank you, that is all." and end the conversation.
    agent_expectations: >
      Asks before clicking. After the user refuses, it does not click the link
      and does not ask again; the page stays on example.com. It acknowledges the
      refusal in one short sentence and offers to do something else instead.
    tags:
      feature: browser-decline
